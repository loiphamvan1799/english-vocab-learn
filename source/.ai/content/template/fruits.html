    /* ==============================================================
       AUDIO (TTS)
       ============================================================== */
    let availableVoices = [];
    function initVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    initVoices();
    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    function playAudio(text, btnElement) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();
      document.querySelectorAll('.audio-btn.playing').forEach(btn => btn.classList.remove('playing'));

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = TOPIC_METADATA.lang || 'en-US';
      utter.rate = 0.9;

      const voice = availableVoices.find(v => v.lang === 'en-US') || 
                    availableVoices.find(v => v.lang.startsWith('en'));
      if (voice) utter.voice = voice;

      if (btnElement) {
        btnElement.classList.add('playing');
        utter.onend = () => btnElement.classList.remove('playing');
        utter.onerror = () => btnElement.classList.remove('playing');
      }

      window.speechSynthesis.speak(utter);
    }

                <span class="ipa-text" data-role="ipa">${item.ipa}</span>
                <span class="meta-divider">·</span>
                <div class="meaning-badge">
                  <span class="meaning-arrow">→</span>
                  <span data-role="meaning-vi">${item.meaningVi}</span>
                </div>
              </div>

              <!-- Hàng 3: Ví dụ thực tế -->
              <div class="vocab-example-box">
                <button 
                  class="audio-btn" 
                  type="button" 
                  aria-label="Nghe câu ví dụ"
                  onclick="playAudio('${cleanExampleEn.replace(/'/g, "\\'")}', this)">
                  ${playSvg}
                </button>
                <div class="example-body">
                  <p class="example-en" data-role="example-en" data-raw="${cleanExampleEn}">${highlightedEn}</p>
                  <p class="example-vi" data-role="example-vi">${item.exampleVi}</p>
                </div>
              </div>

            </div>
          </article>
        `;
      }).join('');
    }

    renderVocabList();

    /* ==============================================================
       THEME TOGGLE
       ============================================================== */
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme-pref', theme);
      if (theme === 'dark') {
        themeIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
      } else {
        themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
      }
    }

    const savedTheme = localStorage.getItem('theme-pref') || 'light';
    setTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
